<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sitca</title>
<style>
  /* the opening card: the mark, the line, on black */
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0c0c0d;color:#fff;font-family:Inter,'Segoe UI',system-ui,sans-serif;overflow:hidden}
  .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
  .mark{width:64px;height:64px;opacity:0;animation:in .7s ease .2s forwards}
  .mark circle:last-child{transform-box:view-box;transform-origin:32px 32px;animation:orbit 1.6s linear infinite}
  h1{font-size:54px;font-weight:700;letter-spacing:-.03em;opacity:0;animation:in .7s ease .6s forwards}
  p{font-size:22px;color:#a3a3ab;opacity:0;animation:in .7s ease 1.0s forwards}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes orbit{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="c">
  <svg class="mark" viewBox="0 0 64 64" fill="currentColor"><circle cx="32" cy="32" r="20" fill="none" stroke="currentColor" stroke-width="9"/><circle cx="46.1" cy="17.9" r="9"/></svg>
  <h1>Attend once. Keep it forever.</h1>
  <p>Sitca sits in your meetings, listens, answers, and remembers.</p>
</div>
</body>
</html>
