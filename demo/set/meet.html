<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meet – wkr-qzbm-dfe</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  /* A video-call room, the way everyone knows one: dark, two tiles, a bar of
     round buttons at the foot. A stage set for the demo — it does nothing. */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#202124;color:#e8eaed;font-family:'Google Sans',Roboto,'Segoe UI',system-ui,sans-serif;overflow:hidden}
  .stage{position:absolute;inset:0 0 80px;padding:16px;display:grid;grid-template-columns:1fr;gap:12px}
  .tile{position:relative;border-radius:12px;overflow:hidden;background:#3c4043}
  .tile.main{background:radial-gradient(ellipse at 30% 20%,#2b2f36,#1b1d21 70%)}
  .tile .bg{position:absolute;inset:0;background:
      radial-gradient(circle at 78% 30%,rgba(255,255,255,.06),transparent 22%),
      radial-gradient(circle at 20% 80%,rgba(255,255,255,.04),transparent 30%),
      linear-gradient(180deg,#2a2d33,#1c1e22);}
  .tile .shelf{position:absolute;left:8%;right:8%;top:22%;height:2px;background:rgba(255,255,255,.08)}
  .tile .plant{position:absolute;right:9%;bottom:18%;width:120px;height:170px}
  .avatar{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:160px;height:160px;border-radius:50%;display:grid;place-items:center;font-size:64px;font-weight:500;color:#fff;background:#8e24aa;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  .tile.small .avatar{width:64px;height:64px;font-size:28px;background:#1e88e5}
  .name{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:8px;font-size:14px;background:rgba(0,0,0,.35);padding:6px 10px;border-radius:6px}
  .name .mic{width:16px;height:16px;fill:#e8eaed}
  .ring{position:absolute;inset:0;border-radius:12px;border:3px solid transparent;transition:border-color .12s}
  .tile.speaking .ring{border-color:#8ab4f8}
  .speak{position:absolute;right:12px;top:12px;display:none;gap:3px;align-items:flex-end;height:20px;background:rgba(0,0,0,.35);padding:4px 7px;border-radius:12px}
  .tile.speaking .speak{display:flex}
  .speak i{width:4px;background:#8ab4f8;border-radius:2px;animation:bar .5s ease-in-out infinite alternate}
  .speak i:nth-child(2){animation-delay:.12s}.speak i:nth-child(3){animation-delay:.24s}
  @keyframes bar{from{height:4px}to{height:14px}}
  .tile.small{position:absolute;right:28px;bottom:96px;width:220px;height:124px;z-index:2;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  .bar{position:absolute;left:0;right:0;bottom:0;height:80px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 20px}
  .time{font-size:14px;display:flex;gap:10px;align-items:center}
  .time .sep{opacity:.5}
  .ctr{display:flex;gap:8px;justify-content:center}
  .b{width:48px;height:48px;border-radius:50%;background:#3c4043;display:grid;place-items:center;border:none;cursor:pointer}
  .b svg{width:22px;height:22px;fill:#e8eaed}
  .b.red{background:#ea4335}
  .b.leave{width:70px;border-radius:24px}
  .b.on{background:#8ab4f8}.b.on svg{fill:#202124}
  .right{display:flex;justify-content:flex-end;gap:6px}
  .ic{width:44px;height:44px;border-radius:50%;background:transparent;border:none;display:grid;place-items:center;position:relative}
  .ic svg{width:22px;height:22px;fill:#e8eaed}
  .ic .n{position:absolute;top:2px;right:2px;font-size:10px;background:#8ab4f8;color:#202124;border-radius:9px;padding:1px 5px;font-weight:700}
  .cap{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);max-width:70%;background:rgba(0,0,0,.6);padding:10px 16px;border-radius:8px;font-size:18px;display:none}
</style>
</head>
<body>

  <div class="time"><span id="clock">10:02 AM</span><span class="sep">|</span><span>wkr-qzbm-dfe</span></div>

    <button class="b" title="Microphone"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg></button>

  </div>
  <div class="right">
    <button class="ic" title="Meeting details"><svg viewBox="0 0 24 24"><path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16z"/></svg></button>

<script>
  // the clock runs; Priya "speaks" in natural bursts while the recorder says so
  const clock = document.getElementById('clock')
  const start = new Date(); start.setHours(10, 2, 0, 0)
  const t0 = Date.now()
  setInterval(() => {
    const d = new Date(start.getTime() + (Date.now() - t0))
    let h = d.getHours(); const m = String(d.getMinutes()).padStart(2, '0'); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12
    clock.textContent = `${h}:${m} ${ap}`
  }, 1000)
  const priya = document.getElementById('priya')
  let talking = false
  function burst () {
    if (!talking) { priya.classList.remove('speaking'); return }
    const on = Math.random() < 0.8
    priya.classList.toggle('speaking', on)
    setTimeout(burst, on ? 700 + Math.random() * 1800 : 250 + Math.random() * 500)
  }
  window.meet = {
    talk (v) { talking = v; burst() },
    caption (text) { const c = document.getElementById('cap'); c.textContent = text; c.style.display = text ? 'block' : 'none' }
  }
  // a keepalive for the fake mic: the page that is "the call" stays audible to the share
  if (location.hash === '#talk') window.meet.talk(true)
</script>
