<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sitca</title>
<style>
  /* a title card for the advert: words that land one line at a time on a
     dark, slowly breathing background; ?t=line|line&s=sub&k=kicker&m=1 */
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0b0b0d;color:#fff;font-family:Inter,'Segoe UI',system-ui,sans-serif;overflow:hidden}
  .bg{position:absolute;inset:-20%;background:
      radial-gradient(ellipse at 20% 30%,rgba(120,120,140,.22),transparent 55%),
      radial-gradient(ellipse at 80% 70%,rgba(90,90,110,.18),transparent 55%);
      animation:breathe 9s ease-in-out infinite alternate}
  @keyframes breathe{from{transform:translate(-2%,-1%) scale(1)}to{transform:translate(2%,1%) scale(1.06)}}
  .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:0 8%;text-align:center}
  .k{font-size:15px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#8f8f97;opacity:0;animation:in .6s ease .15s forwards}
  .mark{width:72px;height:72px;opacity:0;animation:in .7s ease .1s forwards}
  .mark circle:last-child{transform-box:view-box;transform-origin:32px 32px;animation:orbit 1.6s linear infinite}
  h1{font-size:clamp(44px,5.6vw,84px);line-height:1.08;letter-spacing:-.035em;font-weight:750;max-width:20ch}
  h1 span{display:block;opacity:0;transform:translateY(22px);animation:in .7s cubic-bezier(.2,.8,.2,1) forwards}
  h1 span:nth-child(1){animation-delay:.25s}
  h1 span:nth-child(2){animation-delay:.55s}
  h1 span:nth-child(3){animation-delay:.85s}
  .s{font-size:clamp(18px,1.6vw,26px);color:#b3b3ba;max-width:44ch;line-height:1.45;opacity:0;animation:in .7s ease 1.1s forwards}
  .url{font-size:22px;color:#fff;background:#1c1c20;border:1px solid #2e2e33;border-radius:999px;padding:14px 30px;opacity:0;animation:in .7s ease 1.3s forwards}
  @keyframes in{to{opacity:1;transform:none}}
  @keyframes orbit{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="c" id="c"></div>
<script>
  const q = new URLSearchParams(location.search)
  const c = document.getElementById('c')
  const esc = (s) => s.replace(/[&<>]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[ch]))
  let h = ''
  if (q.get('m')) h += '<svg class="mark" viewBox="0 0 64 64" fill="currentColor"><circle cx="32" cy="32" r="20" fill="none" stroke="currentColor" stroke-width="9"/><circle cx="46.1" cy="17.9" r="9"/></svg>'
  if (q.get('k')) h += `<div class="k">${esc(q.get('k'))}</div>`
  if (q.get('t')) h += `<h1>${q.get('t').split('|').map((l) => `<span>${esc(l)}</span>`).join('')}</h1>`
  if (q.get('s')) h += `<div class="s">${esc(q.get('s'))}</div>`
  if (q.get('u')) h += `<div class="url">${esc(q.get('u'))}</div>`
  c.innerHTML = h
</script>
</body>
</html>
