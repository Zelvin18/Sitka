<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sitka — Stage</title>
<style>
:root{--bg:#0d0d0f;--soft:#17171a;--text:#f2f2f4;--t2:#9a9aa2;--t3:#5c5c64;--border:#2a2a2f;--danger:#e0574c}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;cursor:none}
.hidden{display:none!important}

/* top bar */
.top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:16px;padding:22px 34px;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:19px;letter-spacing:-.01em}
.dot{width:11px;height:11px;border-radius:50%;background:var(--text)}
.ttl{font-size:18px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.live{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:800;letter-spacing:.09em;color:var(--danger)}
.live.soon{color:var(--t3)}
.ldot{width:10px;height:10px;border-radius:50%;background:currentColor;animation:blip 1.5s ease infinite}
.live.soon .ldot{animation:none}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}
.count{font-size:14px;color:var(--t3);font-weight:650}

/* waiting / ended center */
.center{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;gap:6px}
.big{font-size:clamp(34px,5vw,64px);font-weight:800;letter-spacing:-.03em;max-width:80vw}
.sub{font-size:clamp(16px,2vw,24px);color:var(--t2)}
.countdown{font-size:clamp(40px,7vw,96px);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:12px 0}
.qrbig{background:#fff;border-radius:24px;padding:18px;margin-top:26px}
.joinurl{font-family:ui-monospace,monospace;font-size:clamp(14px,1.6vw,20px);color:var(--t2);margin-top:14px}
.rings{position:relative;height:170px;width:100%;margin-bottom:6px}
.ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:2px solid var(--border);border-radius:50%;animation:ripple 3s ease-out infinite}
.r1{width:70px;height:70px}.r2{width:130px;height:130px;opacity:.6;animation-delay:.4s}.r3{width:195px;height:195px;opacity:.3;animation-delay:.8s}
.cdot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:16px;height:16px;background:var(--text);border-radius:50%}
@keyframes ripple{0%{transform:translate(-50%,-50%) scale(.94);opacity:.9}100%{transform:translate(-50%,-50%) scale(1.12);opacity:.35}}

/* live captions */
.caps{position:fixed;left:6vw;right:6vw;bottom:9vh;display:flex;flex-direction:column;gap:2.2vh;z-index:3}
.cap{font-size:clamp(22px,3.4vw,52px);font-weight:650;line-height:1.35;letter-spacing:-.01em;animation:capin .5s ease}
.cap.old1{opacity:.45;font-size:clamp(18px,2.6vw,38px)}
.cap.old2{opacity:.2;font-size:clamp(16px,2.2vw,30px)}
@keyframes capin{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.capwait{color:var(--t3);font-size:clamp(18px,2.4vw,32px);font-weight:550}

/* corner QR while live */
.qrmini{position:fixed;right:30px;bottom:30px;z-index:6;text-align:center}
.qrmini .qrbox{background:#fff;border-radius:14px;padding:8px;display:inline-block}
.qrmini div{font-size:12.5px;color:var(--t3);margin-top:6px;font-weight:650;letter-spacing:.04em}

/* takeovers (poll / note) */
.takeover{position:fixed;inset:0;background:rgba(10,10,12,.94);z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6vw;animation:capin .4s ease}
.tk-tag{font-size:15px;font-weight:800;letter-spacing:.14em;color:var(--danger);margin-bottom:18px}
.tk-q{font-size:clamp(28px,4.4vw,60px);font-weight:800;letter-spacing:-.02em;text-align:center;max-width:80vw;margin-bottom:5vh}
.tk-opts{width:min(760px,86vw);display:flex;flex-direction:column;gap:16px}
.tk-row{position:relative;border:1px solid var(--border);border-radius:16px;padding:18px 24px;overflow:hidden;display:flex;justify-content:space-between;align-items:center}
.tk-bar{position:absolute;left:0;top:0;bottom:0;background:var(--soft);z-index:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.tk-opt{position:relative;z-index:1;font-size:clamp(18px,2.2vw,30px);font-weight:650}
.tk-pct{position:relative;z-index:1;font-size:clamp(16px,2vw,26px);color:var(--t2);font-variant-numeric:tabular-nums}
.tk-note{font-size:clamp(22px,3vw,42px);font-weight:600;line-height:1.5;max-width:70vw;text-align:center;color:var(--text)}
.tk-foot{margin-top:5vh;color:var(--t3);font-size:16px}
</style>
</head>
<body>
<div class="top">
  <span class="brand"><span class="dot"></span>Sitka</span>
  <span class="ttl" id="sttl"></span>
  <span class="count" id="scount"></span>
  <span class="live soon" id="sbadge"><span class="ldot"></span><span id="sbadgetext">SOON</span></span>
</div>

<div class="center" id="swait">
  <div class="rings"><span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span><span class="cdot"></span></div>
  <div class="big" id="wtitle"></div>
  <div class="countdown hidden" id="wcount"></div>
  <div class="sub">Join from your phone — your own AI companion, in your language</div>
  <canvas id="wqr" class="qrbig"></canvas>
  <div class="joinurl" id="wurl"></div>
</div>

<div class="center hidden" id="sended">
  <div class="big">Thank you.</div>
  <div class="sub" id="endsub">Your take-home pack is ready on your phone.</div>
  <canvas id="endqr" class="qrbig hidden"></canvas>
  <div class="joinurl hidden" id="endurl"></div>
</div>

<div id="slive" class="hidden">
  <div class="caps" id="scaps"><div class="capwait">Listening…</div></div>
  <div class="qrmini"><span class="qrbox"><canvas id="mqr"></canvas></span><div>JOIN ON YOUR PHONE</div></div>
</div>

<div class="takeover hidden" id="tkpoll">
  <div class="tk-tag">LIVE POLL — VOTE ON YOUR PHONE</div>
  <div class="tk-q" id="tkq"></div>
  <div class="tk-opts" id="tkopts"></div>
  <div class="tk-foot" id="tkfoot"></div>
</div>

<div class="takeover hidden" id="tknote">
  <div class="tk-tag">A QUICK RECAP</div>
  <div class="tk-note" id="tknotetext"></div>
</div>

<script type="module" src="/src/stage.ts"></script>
</body>
</html>
