<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Sitka — Recap</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0c0c0d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Recap, second take: a cinema, not a document. One deliberate look — dark
   stage, editorial type, the recording always within reach. */
:root{--bg:#0c0c0d;--bg2:#131315;--bg3:#1b1b1e;--line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.18);--text:#f2f2f4;--t2:#a9a9b1;--t3:#6f6f78;--danger:#d0524a;--serif:'Fraunces',Georgia,'Times New Roman',serif;--sans:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;--ink:#fff;--ink-fg:#0c0c0d;--glass:rgba(19,19,21,.86)}
/* the light take: paper instead of a cinema, everything else the same */
html[data-theme=light]{--bg:#fbfbf9;--bg2:#f3f3f0;--bg3:#ebebe7;--line:rgba(0,0,0,.09);--line2:rgba(0,0,0,.18);--text:#151517;--t2:#5f5f66;--t3:#9a9aa1;--ink:#151517;--ink-fg:#fff;--glass:rgba(251,251,249,.9);color-scheme:light}
html[data-theme=light] .hdr{background:linear-gradient(to bottom,rgba(0,0,0,.55),rgba(0,0,0,0));color:#fff}
html[data-theme=light] .hdr.solid{background:var(--glass);color:var(--text)}
html[data-theme=light] .stage .shade{background:linear-gradient(to top,rgba(0,0,0,.92) 0%,rgba(0,0,0,.45) 38%,rgba(0,0,0,0) 70%)}
html[data-theme=light] .stage{color:#fff}
*{box-sizing:border-box}
html{color-scheme:dark}
.theme{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:transparent;color:inherit;display:flex;align-items:center;justify-content:center;cursor:pointer}
.theme:hover{background:rgba(127,127,127,.15)}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
a{color:inherit}
button{font:inherit;color:inherit}
.hidden{display:none!important}
::selection{background:rgba(255,255,255,.25)}

/* header */
.hdr{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:14px;height:56px;padding:0 22px;color:#fff;background:linear-gradient(to bottom,rgba(12,12,13,.85),rgba(12,12,13,0));pointer-events:none;transition:background .2s ease}
.hdr>*{pointer-events:auto}
.hdr.solid{background:rgba(12,12,13,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;text-decoration:none}
.mark{width:18px;height:18px;display:block;flex:none}
.mark-live circle:last-child{transform-box:view-box;transform-origin:32px 32px;animation:orbit 1.6s linear infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
.hdr .tag{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--t2);border:1px solid var(--line2);border-radius:6px;padding:2px 7px}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.lang{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--t2)}
.lang select{font:inherit;font-size:13px;color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--line2);border-radius:10px;padding:5px 9px}
/* the dropdown list is drawn by the system: dark words on a light sheet, whatever the page */
.lang select option{color:#151517;background:#fff}
.mini{display:none;align-items:center;gap:12px;flex:1;min-width:0}
.hdr.solid .mini.on{display:flex}
.mini .mp{width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.mini .mt{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mini .mtime{font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums;white-space:nowrap}
.mini .mbar{flex:1;height:2px;background:var(--line);border-radius:2px;overflow:hidden;min-width:60px}
.mini .mbar i{display:block;height:100%;width:0;background:#fff}

/* stage */
.stage{position:relative;width:100%;height:min(72vh,720px);min-height:360px;background:#000;overflow:hidden}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.stage video[hidden]{display:none}
.stage.audio video{opacity:0}
.stage .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(12,12,13,.96) 0%,rgba(12,12,13,.5) 38%,rgba(12,12,13,0) 70%);pointer-events:none;transition:opacity .35s ease}
.stage.playing .shade{opacity:.35}
.stage .grain{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.2px);background-size:26px 26px;opacity:.5;pointer-events:none;-webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,#000 20%,transparent 80%);mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,#000 20%,transparent 80%)}
.stage.playing .grain,.stage.hasvideo .grain{display:none}
.stage .hero{position:absolute;left:0;right:0;bottom:0;padding:0 40px 34px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;transition:opacity .35s ease,transform .35s ease}
.stage.playing .hero{opacity:0;transform:translateY(8px);pointer-events:none}
.stage.playing:hover .hero,.stage.playing.paused .hero{opacity:1;transform:none;pointer-events:auto}
.kicker{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t2);margin-bottom:10px;display:flex;align-items:center;gap:10px}
.kicker .ldot{width:7px;height:7px;border-radius:50%;background:var(--danger)}
h1.title{font-family:var(--serif);font-weight:500;font-size:clamp(24px,3.2vw,40px);line-height:1.08;letter-spacing:-.015em;margin:0 0 10px;max-width:22ch;font-variation-settings:'opsz' 96}
.meta{font-size:13.5px;color:var(--t2);display:flex;gap:14px;flex-wrap:wrap}
.playbig{flex:none;display:flex;align-items:center;gap:14px;background:#fff;color:#0c0c0d;border:0;border-radius:40px;padding:12px 22px 12px 14px;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 12px 40px rgba(0,0,0,.5);transition:transform .15s ease}
.playbig:hover{transform:translateY(-1px)}
.playbig .pring{width:40px;height:40px;border-radius:50%;background:#0c0c0d;color:#fff;display:flex;align-items:center;justify-content:center}
.playbig small{display:block;font-weight:500;font-size:12px;color:#5a5a62}
.playbig .pring .ring{display:none}
.playbig.busy .pring svg{display:none}
.playbig.busy .pring .ring{display:block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:orbit .9s linear infinite}
.stage.hasvideo:not(.playing) .playbig{box-shadow:0 12px 40px rgba(0,0,0,.5)}
.para span.l.screen{display:inline-block;margin:6px 0;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);font-size:14px;line-height:1.55}
.para span.l.screen::before{content:'On screen';display:block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:3px}
.para span.l b{color:var(--text);font-weight:600}
.dock .open{width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;position:relative;margin-left:-6px}
.dock .open .n{position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;border-radius:8px;background:var(--ink);color:var(--ink-fg);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.dock .open .n[hidden]{display:none}
html[data-theme=light] .dock{background:var(--glass);border-color:var(--line2)}
html[data-theme=light] .dock button[type=submit]{background:var(--ink);color:var(--ink-fg)}
html[data-theme=light] .sheet{background:var(--glass)}
html[data-theme=light] .bub-u{background:rgba(0,0,0,.07);color:var(--text)}
html[data-theme=light] .chapters .fill,html[data-theme=light] .chapters li.done::before,html[data-theme=light] .chapters li.now::before{background:var(--ink);border-color:var(--ink)}
html[data-theme=light] .chapters li.now::before{box-shadow:0 0 0 4px rgba(0,0,0,.1)}
html[data-theme=light] .para span.l.now{background:rgba(0,0,0,.08)}
html[data-theme=light] .moment.now{border-color:var(--ink)}
html[data-theme=light] .unfold{color:var(--text)}
html[data-theme=light] .mini .mbar i{background:var(--ink)}
.playbig.busy .pring svg{animation:orbit 1.1s linear infinite}
.playbig.dim{background:rgba(255,255,255,.12);color:#fff;box-shadow:none;cursor:default}
.playbig.dim .pring{background:rgba(255,255,255,.14)}
.playbig.dim small{color:var(--t2)}
/* the recording's own controls, ours */
.bar{position:absolute;left:40px;right:40px;bottom:22px;display:flex;align-items:center;gap:12px;opacity:0;transition:opacity .25s ease}
.stage.hasvideo.playing .bar,.stage.hasvideo:hover .bar,.stage.hasvideo.paused .bar{opacity:1}
.bar button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:rgba(12,12,13,.55);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.bar .track{flex:1;height:22px;display:flex;align-items:center;cursor:pointer}
.bar .track i{position:relative;display:block;width:100%;height:3px;border-radius:3px;background:rgba(255,255,255,.22)}
.bar .track i b{position:absolute;left:0;top:0;bottom:0;width:0;background:#fff;border-radius:3px}
.bar .track i em{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);left:0;box-shadow:0 0 0 4px rgba(255,255,255,.18)}
.bar .t{font-size:12px;font-variant-numeric:tabular-nums;color:#fff;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.audio-bars{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;align-items:flex-end;gap:5px;height:80px;opacity:0;transition:opacity .4s ease}
.stage.audio .audio-bars{opacity:1}
.audio-bars i{display:block;width:6px;border-radius:3px;background:rgba(255,255,255,.55);height:12px;transform-origin:bottom}
.stage.audio.playing .audio-bars i{animation:eq 1.1s ease-in-out infinite}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}

/* body */
.wrap{max-width:1180px;margin:0 auto;padding:36px 40px 140px;display:grid;grid-template-columns:260px 1fr;gap:56px}
.spine{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 100px);overflow:auto;padding-right:6px}
.spine h4,.sec h4{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin:0 0 14px}
.chapters{position:relative;margin:0;padding:0 0 0 22px;list-style:none}
.chapters::before{content:'';position:absolute;left:6px;top:8px;bottom:8px;width:1px;background:var(--line2)}
.chapters .fill{position:absolute;left:6px;top:8px;width:1px;background:#fff;height:0;transition:height .3s linear}
.chapters li{position:relative;padding:8px 0 8px 4px;cursor:pointer;color:var(--t2);font-size:13.5px;line-height:1.35;border-radius:8px}
.chapters li::before{content:'';position:absolute;left:-19.5px;top:14px;width:6px;height:6px;border-radius:50%;background:var(--bg);border:1px solid var(--line2);transition:background .2s ease}
.chapters li:hover{color:var(--text)}
.chapters li.done::before{background:#fff;border-color:#fff}
.chapters li.now{color:var(--text)}
.chapters li.now::before{background:#fff;border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.15)}
.chapters li .ct{display:block;font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums;margin-bottom:1px}
.spine .follow{margin-top:18px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--t3);cursor:pointer;user-select:none}
.spine .follow input{accent-color:#fff}

.main{min-width:0}
.lead{font-family:var(--serif);font-weight:300;font-size:clamp(20px,2.1vw,26px);line-height:1.45;letter-spacing:-.01em;color:var(--text);margin:0 0 36px;font-variation-settings:'opsz' 60}
.lead.pending{color:var(--t3);font-style:italic}
.sec{margin-bottom:40px}
.moments{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.moment{position:relative;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--bg2);padding:14px 14px 12px;cursor:pointer;transition:border-color .15s ease,transform .15s ease;font:inherit;color:inherit}
.moment:hover{border-color:var(--line2);transform:translateY(-1px)}
.moment .mt{font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.moment .mt::before{content:'';width:0;height:0;border-left:6px solid var(--t3);border-top:4px solid transparent;border-bottom:4px solid transparent}
.moment .ml{font-size:13.5px;font-weight:600;line-height:1.35}
.moment.now{border-color:#fff}
.notes{color:var(--t2);font-size:14.5px}
.notes h1,.notes h2,.notes h3,.notes h4{color:var(--text);font-family:var(--serif);font-weight:500;letter-spacing:-.01em;margin:22px 0 8px}
.notes p{margin:0 0 10px}
.notes li{margin:4px 0}
.notes .tchip,.md .tchip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--text);background:rgba(255,255,255,.08);border:1px solid var(--line2);border-radius:20px;padding:1px 8px;cursor:pointer;vertical-align:1px;font-family:var(--sans)}
.notes .tchip::before,.md .tchip::before{content:'';width:0;height:0;border-left:5px solid currentColor;border-top:3.5px solid transparent;border-bottom:3.5px solid transparent}
.md table{border-collapse:collapse;width:100%;font-size:13.5px;margin:8px 0}
.md th,.md td{border:1px solid var(--line);padding:6px 9px;text-align:left}
.md .tw{overflow-x:auto}
.doccard{border:1px solid var(--line);border-radius:12px;background:var(--bg2);margin:10px 0;overflow:hidden}
.doccard-title{font-weight:650;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--bg3)}
.doccard-body{padding:10px 12px}

/* the story: the words as paragraphs, lit as they are spoken */
.story-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.search{width:260px;max-width:100%;font:inherit;font-size:13.5px;color:var(--text);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.search:focus{outline:none;border-color:var(--line2)}
.story{position:relative}
.story.folded{max-height:520px;overflow:hidden}
.story.folded::after{content:'';position:absolute;left:0;right:0;bottom:0;height:140px;background:linear-gradient(to bottom,transparent,var(--bg));pointer-events:none}
.para{display:grid;grid-template-columns:52px 1fr;gap:14px;padding:6px 0 14px;font-size:16px;line-height:1.7;color:var(--t2)}
.para .pt{font-size:11.5px;color:var(--t3);font-variant-numeric:tabular-nums;padding-top:6px;cursor:pointer}
.para .pt:hover{color:var(--text)}
.para span.l{cursor:pointer;border-radius:4px;padding:0 2px;margin:0 -2px;transition:background .15s ease,color .15s ease}
.para span.l:hover{color:var(--text)}
.para span.l.now{background:rgba(255,255,255,.14);color:var(--text)}
.para span.l.hit{color:var(--text);text-decoration:underline;text-decoration-color:var(--t3);text-underline-offset:3px}
.para.dim{display:none}
.unfold{display:block;margin:14px auto 0;border:1px solid var(--line2);background:transparent;color:var(--text);border-radius:22px;padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer}
.unfold:hover{background:rgba(255,255,255,.06)}
.unfold[hidden]{display:none}
.empty{color:var(--t3);font-size:14px;padding:18px;border:1px dashed var(--line);border-radius:12px}

/* ask dock and sheet */
.dock{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:40;width:min(640px,calc(100vw - 32px));display:flex;align-items:center;gap:10px;background:rgba(19,19,21,.82);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--line2);border-radius:30px;padding:8px 8px 8px 16px;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.dock .mark{width:18px;height:18px;color:#fff}
.dock input{flex:1;min-width:0;font:inherit;font-size:15px;color:var(--text);background:transparent;border:0;outline:none}
.dock input::placeholder{color:var(--t3)}
.dock button{width:38px;height:38px;border-radius:50%;border:0;background:#fff;color:#0c0c0d;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.dock button:disabled{opacity:.4;cursor:default}
.dock .kbd{font-size:11px;color:var(--t3);border:1px solid var(--line);border-radius:5px;padding:0 5px;flex:none}
.sheet{position:fixed;top:0;right:0;bottom:0;z-index:35;width:min(440px,100vw);background:rgba(19,19,21,.94);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-left:1px solid var(--line2);transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column}
.sheet.open{transform:none}
.sheet-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);font-weight:650}
.sheet-head .x{margin-left:auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sheet-body{flex:1;overflow:auto;padding:16px 18px 110px;display:flex;flex-direction:column;gap:12px}
.bub-u{align-self:flex-end;max-width:85%;background:rgba(255,255,255,.12);color:#fff;border-radius:16px 16px 4px 16px;padding:9px 14px;font-size:14.5px}
.bub-a{align-self:stretch;font-size:14.5px;line-height:1.6;color:var(--text)}
.bub-a p{margin:0 0 10px}
.typing{display:flex;align-items:center;gap:8px;color:var(--t3);font-size:13px}
.err-note{color:var(--danger);font-size:13px}

/* gate / loading / not found */
.center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--t2);padding:24px;text-align:center}
.center .mark{width:34px;height:34px;color:#fff}
.center h1{font-family:var(--serif);font-weight:500;font-size:28px;margin:0;color:var(--text)}
.lw{animation:lw .4s ease}
@keyframes lw{from{opacity:0;transform:translateY(4px)}}

@media(max-width:900px){
  .wrap{grid-template-columns:1fr;gap:28px;padding:22px 18px 150px}
  .spine{position:static;max-height:none;overflow:visible}
  .chapters{display:flex;gap:8px;overflow-x:auto;padding:0 0 6px;scrollbar-width:none}
  .chapters::-webkit-scrollbar{display:none}
  .chapters::before,.chapters .fill{display:none}
  .chapters li{flex:none;border:1px solid var(--line);padding:8px 12px;max-width:220px}
  .chapters li::before{display:none}
  .chapters li.now{border-color:#fff}
  .spine .follow{display:none}
  .stage{height:56vh;min-height:300px}
  .stage .hero{padding:0 18px 22px;flex-direction:column;align-items:flex-start}
  .bar{left:18px;right:18px;bottom:14px}
  .hdr{padding:0 14px}
  .lang span{display:none}
  .para{grid-template-columns:44px 1fr;gap:10px;font-size:15.5px}
  .sheet{width:100vw}
  .dock{bottom:14px}
  .dock .kbd{display:none}
}
</style>
</head>
<body>
<header class="hdr" id="hdr">
  <a class="brand" href="/"><svg class="mark" viewBox="0 0 64 64" fill="currentColor" aria-hidden="true"><circle cx="32" cy="32" r="20" fill="none" stroke="currentColor" stroke-width="9"/><circle cx="46.1" cy="17.9" r="9"/></svg>Sitka</a>
  <span class="tag" id="htag">RECAP</span>
  <div class="mini" id="mini">
    <button class="mp" id="mp" aria-label="Play or pause"><svg id="mpi" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></button>
    <span class="mt" id="mt"></span>
    <span class="mbar"><i id="mbar"></i></span>
    <span class="mtime" id="mtime">0:00</span>
  </div>
  <div class="hdr-right">
    <label class="lang" id="langwrap" hidden><span>Read in</span><select id="lang"></select></label>
    <button class="theme" id="theme" type="button" title="Light or dark" aria-label="Switch between light and dark"><svg id="themei" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </div>
</header>

<div id="loading" class="center">
  <svg class="mark mark-live" viewBox="0 0 64 64" fill="currentColor" aria-hidden="true"><circle cx="32" cy="32" r="20" fill="none" stroke="currentColor" stroke-width="9"/><circle cx="46.1" cy="17.9" r="9"/></svg>
  <div data-words="Opening this recap|Fetching the moments|Almost there">Opening this recap</div>
</div>
<div id="notfound" class="center hidden">
  <h1>This page is not available</h1>
  <div>The owner has not shared it, has stopped sharing it, or the link is wrong.</div>
</div>

<main id="main" class="hidden">
  <section class="stage" id="stage">
    <video id="video" playsinline preload="metadata" hidden></video>
    <div class="grain"></div>
    <div class="audio-bars" aria-hidden="true"><i style="animation-delay:0s"></i><i style="animation-delay:.15s"></i><i style="animation-delay:.3s"></i><i style="animation-delay:.05s"></i><i style="animation-delay:.25s"></i><i style="animation-delay:.4s"></i><i style="animation-delay:.1s"></i></div>
    <div class="shade"></div>
    <div class="hero">
      <div>
        <div class="kicker" id="kicker">Recap</div>
        <h1 class="title" id="title"></h1>
        <div class="meta" id="meta"></div>
      </div>
      <button class="playbig" id="playbig" type="button">
        <span class="pring"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg><span class="ring"></span></span>
        <span><span id="playtext">Play the recording</span><small id="playsub">Loads when you tap</small></span>
      </button>
    </div>
    <div class="bar" id="bar">
      <button id="pp" aria-label="Play or pause"><svg id="ppi" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></button>
      <button id="back10" aria-label="Back ten seconds" title="Back 10 s"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.3-5.7"/><path d="M4 4v5h5"/></svg></button>
      <div class="track" id="track"><i><b id="fill"></b><em id="knob"></em></i></div>
      <span class="t" id="tnow">0:00</span><span class="t" style="color:rgba(255,255,255,.6)" id="tlen"></span>
    </div>
  </section>

  <div class="wrap">
    <aside class="spine">
      <h4>Chapters</h4>
      <ul class="chapters" id="chapters"><span class="fill" id="cfill"></span></ul>
      <label class="follow"><input type="checkbox" id="follow" checked> Follow the words as it plays</label>
    </aside>
    <div class="main">
      <p class="lead" id="lead"></p>
      <section class="sec" id="momsec" hidden><h4>Moments</h4><div class="moments" id="moments"></div></section>
      <section class="sec" id="notesec" hidden><h4>Notes</h4><div class="notes md" id="notes"></div></section>
      <section class="sec">
        <div class="story-head"><h4 style="margin:0">The words</h4><input class="search" id="search" placeholder="Find a word or a phrase…"></div>
        <div class="story folded" id="story"></div>
        <button class="unfold" id="unfold" hidden>Read the whole story</button>
      </section>
    </div>
  </div>
</main>

<form class="dock hidden" id="dock">
  <button type="button" class="open" id="openchat" title="Open the conversation" aria-label="Open the conversation"><svg class="mark" viewBox="0 0 64 64" fill="currentColor" aria-hidden="true"><circle cx="32" cy="32" r="20" fill="none" stroke="currentColor" stroke-width="9"/><circle cx="46.1" cy="17.9" r="9"/></svg><span class="n" id="chatn" hidden>0</span></button>
  <input id="ask" placeholder="Ask anything about this session…" autocomplete="off">
  <span class="kbd">/</span>
  <button type="submit" id="asksend" aria-label="Ask" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
</form>
<aside class="sheet" id="sheet" aria-label="Conversation with Sitka">
  <div class="sheet-head"><svg class="mark" viewBox="0 0 64 64" fill="currentColor" aria-hidden="true" style="width:16px;height:16px"><circle cx="32" cy="32" r="20" fill="none" stroke="currentColor" stroke-width="9"/><circle cx="46.1" cy="17.9" r="9"/></svg>Ask Sitka<button class="x" id="sheetx" aria-label="Close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="sheet-body" id="chat"></div>
</aside>

<script>
(function(){document.querySelectorAll('[data-words]').forEach(function(el){var w=el.getAttribute('data-words').split('|'),i=0;setInterval(function(){if(i>=w.length-1)return;i++;el.textContent=w[i];el.classList.remove('lw');void el.offsetWidth;el.classList.add('lw')},2400)})})();
</script>
<script type="module" src="/src/replay2.ts"></script>
</body>
</html>
